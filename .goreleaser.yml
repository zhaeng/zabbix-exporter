version: 2

project_name: zabbix-exporter

builds:
  - id: zabbix-exporter
    main: ./cmd/server
    binary: zabbix-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zhaeng/zabbix-exporter/cmd/server/initial.Version={{.Version}}
      - -X github.com/zhaeng/zabbix-exporter/cmd/server/initial.GitCommit={{.Commit}}
      - -X github.com/zhaeng/zabbix-exporter/cmd/server/initial.BuildTime={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
