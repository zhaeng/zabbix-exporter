name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除密码、token、API key、内部地址和真实监控数据。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布版本、镜像 tag 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、架构、Go/Zabbix/Prometheus 或 VictoriaMetrics 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 内容不包含凭据或敏感监控数据
          required: true
